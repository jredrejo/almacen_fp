; Configuracion PlatformIO para M5Stack Tab5 (ESP32-P4)
; Usa pioarduino como plataforma con soporte para ESP32-P4
; Documentacion: https://docs.m5stack.com/en/core/Tab5

[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32.git#54.03.21
upload_speed = 1500000
monitor_speed = 115200
build_type = debug
framework = arduino
board = esp32-p4-evboard
board_build.mcu = esp32p4
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCAMERA_ENABLED
    ; Kconfig para driver SC202CS (sensor de camara del Tab5)
    -DCONFIG_CAMERA_SC202CS=1
    -DCONFIG_CAMERA_SC202CS_AUTO_DETECT=1
    -DCONFIG_CAMERA_SC202CS_AUTO_DETECT_MIPI_INTERFACE_SENSOR=1
    -DCONFIG_CAMERA_SC202CS_MIPI_RAW8_1280x720_30FPS=1
    -DCONFIG_CAMERA_SC202CS_MIPI_IF_FORMAT_INDEX_DAFAULT=0
    -DCONFIG_CAMERA_SC202CS_ABSOLUTE_GAIN_LIMIT=63008
    -DCONFIG_CAMERA_SC202CS_DIG_GAIN_PRIORITY=1
    ; Include paths para componentes ESP-IDF de camara (build hibrido)
    -Icomponents/esp_cam_sensor/include
    -Icomponents/esp_cam_sensor/sensors/sc202cs/include
    -Icomponents/esp_cam_sensor/sensors/sc202cs/private_include
    -Icomponents/esp_video/include
    -Icomponents/esp_video/private_include
    -Icomponents/esp_sccb_intf/include
    -Icomponents/esp_sccb_intf/sccb_i2c/include
    -Icomponents/esp_ipa/include
    ; Enlazar librerias pre-compiladas de video/camara ESP-IDF
    -lesp_video
    -lesp_cam_sensor
    -lesp_sccb_intf
    -lesp_driver_cam
    ; IPA: usar la libreria del COMPONENTE (con AE/AWB/AGC), no la del framework (vacia)
    ; --whole-archive fuerza enlace de todas las funciones de deteccion IPA
    -Lcomponents/esp_ipa/lib/esp32p4
    -Wl,--whole-archive -lesp_ipa -Wl,--no-whole-archive
    ; Simbolos de fin de arrays de deteccion (sensor: 1 entrada * 12 bytes, IPA: 6 entradas * 8 bytes)
    -Wl,--defsym=__esp_cam_sensor_detect_fn_array_end=__esp_cam_sensor_detect_fn_array_start+12
    -Wl,-u,__esp_ipa_detect_array_start
    -Wl,--defsym=__esp_ipa_detect_array_end=__esp_ipa_detect_array_start+48

; Fuentes adicionales: driver SC202CS y VFS/mmap de esp_video para V4L2
build_src_filter =
    +<*>
    +<../components/esp_cam_sensor/sensors/sc202cs/sc202cs.c>
    +<../components/esp_video/src/esp_video_vfs.c>
    +<../components/esp_video/src/esp_video_mman.c>
    +<../components/esp_video/src/esp_video_isp_pipeline.c>

; Configuracion ESP-IDF para soporte hibrido de camara MIPI-CSI y JPEG HW encoder
; Permite usar componentes ESP-IDF (esp_cam_sensor, esp_video) desde framework Arduino
custom_sdkconfig =
    CONFIG_SPIRAM=y
    CONFIG_SPIRAM_SPEED_200M=y
    CONFIG_SOC_MIPI_CSI_SUPPORTED=y
    CONFIG_SOC_JPEG_CODEC_SUPPORTED=y
    CONFIG_SOC_JPEG_ENCODE_SUPPORTED=y
    CONFIG_SOC_ISP_SUPPORTED=y

lib_deps =
    https://github.com/M5Stack/M5Unified.git
    https://github.com/M5Stack/M5GFX.git
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0
    arduino-libraries/NTPClient
    JChristensen/Timezone
