upstream django {
    server unix:///tmp/almacen.sock;
}

# Acceso por IP o nombre DNS sin HTTPS - servir directamente
server {
    listen 80 default_server;
    server_name _;

    charset utf-8;
    client_max_body_size 75M;

    # Logs
    access_log /var/log/nginx/almacen_fp_access.log;
    error_log /var/log/nginx/almacen_fp_error.log;

    # Archivos estáticos de Django
    location /static/ {
        alias /opt/almacen_fp/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Archivos media de Django
    location /media/ {
        alias /opt/almacen_fp/media/;
        expires 7d;
    }

    # Proxy a uWSGI para todas las demás peticiones
    location / {
        uwsgi_pass django;
        include /etc/nginx/uwsgi_params;

        # Timeouts
        uwsgi_read_timeout 60;
        uwsgi_send_timeout 60;

        # Headers adicionales
        uwsgi_param Host $host;
        uwsgi_param X-Real-IP $remote_addr;
        uwsgi_param X-Forwarded-For $proxy_add_x_forwarded_for;
        uwsgi_param X-Forwarded-Proto $scheme;
    }
}

# Acceso por nombre de dominio - redirigir a HTTPS
server {
    listen 80;
    server_name fp.santiagoapostol.net;

    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name fp.santiagoapostol.net;
    
    # Certificados SSL (se configurarán con certbot)
    ssl_certificate /etc/letsencrypt/live/fp.santiagoapostol.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fp.santiagoapostol.net/privkey.pem;
    
    # Configuración SSL moderna
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    
    charset utf-8;
    client_max_body_size 75M;
    
    # Logs
    access_log /var/log/nginx/almacen_fp_access.log;
    error_log /var/log/nginx/almacen_fp_error.log;
    
    # Archivos estáticos de Django
    location /static/ {
        alias /opt/almacen_fp/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Archivos media de Django
    location /media/ {
        alias /opt/almacen_fp/media/;
        expires 7d;
    }
    
    # Proxy a uWSGI para todas las demás peticiones
    location / {
        uwsgi_pass django;
        include /etc/nginx/uwsgi_params;
        
        # Timeouts
        uwsgi_read_timeout 60;
        uwsgi_send_timeout 60;
        
        # Headers adicionales
        uwsgi_param Host $host;
        uwsgi_param X-Real-IP $remote_addr;
        uwsgi_param X-Forwarded-For $proxy_add_x_forwarded_for;
        uwsgi_param X-Forwarded-Proto $scheme;
    }
}

